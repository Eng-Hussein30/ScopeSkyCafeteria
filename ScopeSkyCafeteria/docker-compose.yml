# =============================================================================
# ScopeSky Cafeteria — full stack (SQL Server + API + Frontend)
# =============================================================================
# This file is machine-independent on purpose. Cloning the repo and running
#
#     docker compose up --build
#
# must produce the same working application and the same database schema on every PC.
#
# Two different kinds of addresses are involved, and they must not be mixed up:
#
#   1. Container-to-container (internal): the API reaches SQL Server through the Docker
#      network using the SERVICE NAME `sqlserver`. Never `localhost`, never a LAN IP.
#      `localhost` inside the API container means the API container itself.
#
#   2. LAN/client access (external): phones and other PCs reach the app through the host's
#      LAN address, e.g. http://192.168.x.x:5173. That address is only ever a published
#      port on the host — it is never used for database communication and never appears in
#      this file or in the source tree.
#
#        Other device -> 192.168.x.x:${FRONTEND_PORT} -> host -> frontend container
#                     -> (docker network) api:8080 -> (docker network) sqlserver:1433
#
# Every value below has a working default, so no .env file is required for the stack to
# start. Create a `.env` next to this file (copy `.env.example`) to override anything —
# and DO override the passwords and JWT_KEY for anything beyond local development.
# =============================================================================

services:

  # ===========================================================================
  # API
  # ===========================================================================

  api:
    build: .

    container_name: ${API_CONTAINER_NAME:-scopesky-api}

    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    ports:
      - "${API_PORT:-5000}:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

      minio:
        condition: service_started

    environment:

      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}

      ASPNETCORE_URLS: http://+:8080

      # ---------------------------------------------------------------------
      # Container-to-container database configuration
      # ---------------------------------------------------------------------

      DB_CONNECTION: "Server=${DB_HOST:-sqlserver},${DB_PORT:-1433};Database=${DB_NAME:-SSCafeteriaDbContext};User Id=${DB_USER:-sa};Password=${MSSQL_SA_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;MultipleActiveResultSets=True;Connect Timeout=60"

      # Startup migration behaviour

      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}

      DB_MIGRATE_MAX_ATTEMPTS: ${DB_MIGRATE_MAX_ATTEMPTS:-12}

      DB_MIGRATE_RETRY_DELAY_SECONDS: ${DB_MIGRATE_RETRY_DELAY_SECONDS:-5}

      # ---------------------------------------------------------------------
      # Auth
      # ---------------------------------------------------------------------

      JWT_KEY: ${JWT_KEY:-HhAa19961968Mm2003AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoBbQqRrSsTtUuVvWwXxYyZz}

      JWT_ISSUER: ${JWT_ISSUER:-ScopeSkyCafeteria}

      JWT_AUDIENCE: ${JWT_AUDIENCE:-ScopeSkyCafeteriaUsers}

      # ---------------------------------------------------------------------
      # LAN / client access configuration
      # ---------------------------------------------------------------------

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      # ---------------------------------------------------------------------
      # Seeded accounts
      # ---------------------------------------------------------------------

      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-SuperAdmin}

      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@test.com}

      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-SuperAdmin@1996}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-Admin}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@test.com}

      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1996}

      # ---------------------------------------------------------------------
      # MinIO
      # ---------------------------------------------------------------------

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}

      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}

      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}

      MINIO_BUCKET: ${MINIO_BUCKET:-scopesky-products}

      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}


  # ===========================================================================
  # SQL Server
  # ===========================================================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest

    container_name: ${SQL_CONTAINER_NAME:-sqlserver}

    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:

      ACCEPT_EULA: "Y"

      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrongPassword123!}

    ports:
      - "${SQL_BIND:-127.0.0.1}:${SQL_HOST_PORT:-1433}:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'SQLCMD=$$(command -v sqlcmd || echo /opt/mssql-tools18/bin/sqlcmd); "$$SQLCMD" -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]

      interval: 10s

      timeout: 5s

      retries: 30

      start_period: 60s


  # ===========================================================================
  # Frontend
  # ===========================================================================

  frontend:

    build:
      context: ../../../Frontend
      target: development

    container_name: ${FRONTEND_CONTAINER_NAME:-scopesky-frontend}

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    environment:

      VITE_PROXY_TARGET: http://api:8080

    volumes:
      - ../../../Frontend:/app
      - /app/node_modules

    depends_on:
      - api


  # ===========================================================================
  # MinIO
  # ===========================================================================

  minio:

    image: minio/minio:latest

    container_name: minio

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    volumes:
      - minio_data:/data


# =============================================================================
# Volumes
# =============================================================================

volumes:

  sql_data:

  minio_data:
services:

  # ==========================================
  # API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: scopesky-api

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # --------------------------------------
      # PostgreSQL
      # --------------------------------------
      DB_CONNECTION: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ScopeSkyCafeteriaDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-ChangeThisPostgresPassword!}"

      # --------------------------------------
      # Database migrations
      # --------------------------------------
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      DB_MIGRATE_MAX_ATTEMPTS: ${DB_MIGRATE_MAX_ATTEMPTS:-12}
      DB_MIGRATE_RETRY_DELAY_SECONDS: ${DB_MIGRATE_RETRY_DELAY_SECONDS:-5}

      # --------------------------------------
      # JWT
      # --------------------------------------
      JWT_KEY: "${JWT_KEY:-YourSuperSecretJwtKeyThatIsAtLeast32CharactersLong!}"
      JWT_ISSUER: "${JWT_ISSUER:-ScopeSkyCafeteria}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ScopeSkyCafeteriaUsers}"

      # --------------------------------------
      # Frontend URL
      # --------------------------------------
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"

      # --------------------------------------
      # Super Admin
      # --------------------------------------
      SUPERADMIN_USERNAME: "${SUPERADMIN_USERNAME:-superadmin}"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:-superadmin@example.com}"
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD:-YourStrongPassword123!}"

      # --------------------------------------
      # Admin
      # --------------------------------------
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-YourStrongPassword123!}"

      # --------------------------------------
      # MinIO
      # --------------------------------------
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-scopesky-products}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

    ports:
      - "${API_PORT:-5000}:8080"

    depends_on:
      postgres:
        condition: service_started

      minio:
        condition: service_started


  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:18

    container_name: scopesky-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ScopeSkyCafeteriaDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPostgresPassword!}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


  # ==========================================
  # MINIO
  # ==========================================
  minio:
    image: minio/minio:latest

    container_name: minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data


# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
  minio_data:
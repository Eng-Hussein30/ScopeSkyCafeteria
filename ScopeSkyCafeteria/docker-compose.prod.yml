services:

  # ==========================================
  # API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scopesky-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # --------------------------------------
      # Database
      # --------------------------------------
      DB_CONNECTION: "Server=${DB_HOST:-sqlserver},${DB_PORT:-1433};Database=${DB_NAME:-ScopeSkyCafeteriaDb};User Id=${DB_USER:-sa};Password=${MSSQL_SA_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;Connect Timeout=60"

      # --------------------------------------
      # JWT
      # --------------------------------------
      JWT_KEY: "${JWT_KEY:-YourSuperSecretJwtKeyThatIsAtLeast32CharactersLong!}"
      JWT_ISSUER: "${JWT_ISSUER:-ScopeSkyCafeteria}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ScopeSkyCafeteriaClient}"

      # --------------------------------------
      # Frontend
      # --------------------------------------
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"

      # --------------------------------------
      # MinIO
      # --------------------------------------
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-MinioAdmin123!}"
      MINIO_BUCKET: "${MINIO_BUCKET:-scopesky-products}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"

      # --------------------------------------
      # Super Admin
      # --------------------------------------
      SUPERADMIN_USERNAME: "${SUPERADMIN_USERNAME:-superadmin}"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:-superadmin@example.com}"
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD:-YourStrongPassword123!}"

    ports:
      - "${API_PORT:-5000}:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

      minio:
        condition: service_started


  # ==========================================
  # SQL SERVER
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scopesky-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrongPassword123!}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"

    ports:
      - "${SQL_BIND:-127.0.0.1}:${SQL_HOST_PORT:-1433}:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ==========================================
  # MINIO
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: scopesky-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-MinioAdmin123!}"

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data


  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ../../Frontend
      target: production

    container_name: scopesky-frontend
    restart: unless-stopped

    depends_on:
      - api


  # ==========================================
  # CADDY
  # ==========================================
  caddy:
    image: caddy:2
    container_name: scopesky-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - api
      - frontend


# ==========================================
# VOLUMES
# ==========================================
volumes:
  sql_data:
  minio_data:
  caddy_data:
  caddy_config: